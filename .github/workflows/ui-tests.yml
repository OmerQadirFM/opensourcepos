name: UI regression tests

on:
  pull_request:
    paths:
      - 'public/js/**'
      - 'tests/javascript/**'
      - 'package*.json'
      - '.github/workflows/ui-tests.yml'
  push:
    branches: [master]
    paths:
      - 'public/js/**'
      - 'tests/javascript/**'
      - 'package*.json'
      - '.github/workflows/ui-tests.yml'

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui
